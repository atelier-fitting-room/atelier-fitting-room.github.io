  (function () {
    var GRACE = 4000;           
    var SLOW_GRACE = 20000;     
    var done = false;           
    var spoke = false;          
    var timer = 0;
    function post(state, why) {
      var m = { type: 'pt3d', state: state, ptReady: state === 'ready' ? 1 : 0 };
      if (state === 'ready') m.v = 2;
      if (why) m.why = why;
      try { if (parent !== window) parent.postMessage(m, '*'); } catch (e) {   }
    }
    window.PT3D_READY = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      post('ready');
    };
    window.PT3D_BOOTED = function () {
      if (done || spoke) return;
      clearTimeout(timer);
      timer = setTimeout(function () { fail('timeout'); }, SLOW_GRACE);
      post('booted');
    };
    function fail(why) {
      if (done || spoke) return;
      spoke = true; clearTimeout(timer);
      post('failed', why);
    }
    window.PT3D_FAILED = fail;
    timer = setTimeout(function () { fail('timeout'); }, GRACE);
    addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t !== window && t.nodeType === 1) { if (t.tagName === 'SCRIPT') fail('module'); return; }
      fail('error');
    }, true);
    addEventListener('unhandledrejection', function () { fail('rejection'); });
  })();

function cropRect(d, W, H) {
  const patch = (x0, y0, n) => {
    let r = 0, g = 0, b = 0, k = 0;
    const xs = Math.max(0, x0), ys = Math.max(0, y0);
    const xe = Math.min(W, x0 + n), ye = Math.min(H, y0 + n);
    for (let y = ys; y < ye; y++) for (let x = xs; x < xe; x++) {
      const i = (y * W + x) << 2; r += d[i]; g += d[i + 1]; b += d[i + 2]; k++;
    }
    return k ? [r / k, g / k, b / k] : [0, 0, 0];
  };
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const inset = Math.round(Math.min(W, H) * 0.03);
  {
    const n = Math.max(4, Math.round(W * 0.06));
    const c = patch(Math.round(W / 2 - n / 2), Math.round(H / 2 - n / 2), n);
    const ds = [patch(0, 0, n), patch(W - n, 0, n), patch(0, H - n, n), patch(W - n, H - n, n)]
      .map((p) => dist(p, c)).sort((a, b) => a - b);
    if (ds[1] > 110) { const s = Math.floor(Math.min(W, H) * 0.34); return { sx: (W - s) >> 1, sy: (H - s) >> 1, s, kind: 'framed' }; }
  }
  const B = 4, bw = Math.ceil(W / B), bh = Math.ceil(H / B);
  const yellowBlocks = [], whiteBlocks = [];
  for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
    let yel = 0, whi = 0, n = 0;
    const ye = Math.min(H, (by + 1) * B), xe = Math.min(W, (bx + 1) * B);
    for (let y = by * B; y < ye; y++) for (let x = bx * B; x < xe; x++) {
      const i = (y * W + x) << 2, r = d[i], g = d[i + 1], b = d[i + 2]; n++;
      if (r > 150 && g > 120 && b < 120 && r - b > 70 && g - b > 45) yel++;
      if (r > 232 && g > 232 && b > 228 && Math.max(r, g, b) - Math.min(r, g, b) < 18) whi++;
    }
    if (n && yel / n >= 0.5) yellowBlocks.push([bx, by]);
    if (n && whi / n >= 0.8) whiteBlocks.push([bx, by]);
  }
  const total = bw * bh;
  const avoidBR = (kind, lc) => {
    const s = Math.floor(Math.min(W, H) * 0.86);
    const cx = lc ? lc[0] : W, cy = lc ? lc[1] : H;             
    return { sx: cx > W / 2 ? inset : W - s - inset, sy: cy > H / 2 ? inset : H - s - inset, s, kind };
  };
  const labels = [];
  if (yellowBlocks.length && yellowBlocks.length <= total * 0.2) labels.push(...yellowBlocks);
  if (whiteBlocks.length && whiteBlocks.length <= total * 0.2) labels.push(...whiteBlocks);
  if (yellowBlocks.length > total * 0.2 && !labels.length) return avoidBR('yellowcloth');
  if (!labels.length) return avoidBR('nochip');
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (const [bx, by] of labels) { x0 = Math.min(x0, bx * B); y0 = Math.min(y0, by * B); x1 = Math.max(x1, (bx + 1) * B); y1 = Math.max(y1, (by + 1) * B); }
  x0 -= B; y0 -= B; x1 += B; y1 += B;
  const cands = [
    { x: 0, y: 0, w: W, h: Math.max(0, y0) },
    { x: 0, y: Math.min(H, y1), w: W, h: Math.max(0, H - y1) },
    { x: 0, y: 0, w: Math.max(0, x0), h: H },
    { x: Math.min(W, x1), y: 0, w: Math.max(0, W - x1), h: H },
  ];
  let best = cands[0];
  for (const c of cands) if (c.w * c.h > best.w * best.h) best = c;
  const cx = best.x + inset, cy = best.y + inset, cw = best.w - 2 * inset, ch = best.h - 2 * inset;
  const s = Math.max(8, Math.min(cw, ch));
  if (s < Math.min(W, H) * 0.5) return avoidBR('chip-fallback', [(x0 + x1) / 2, (y0 + y1) / 2]);
  return { sx: Math.round(cx + (cw - s) / 2), sy: Math.round(cy + (ch - s) / 2), s, kind: 'chip' };
}

function chipAwareCrop(im) {
  const PROBE = 256;
  const sc = Math.min(PROBE / im.width, PROBE / im.height, 1);
  const W = Math.max(8, Math.round(im.width * sc)), H = Math.max(8, Math.round(im.height * sc));
  const probe = document.createElement('canvas');
  probe.width = W; probe.height = H;
  const px = probe.getContext('2d', { willReadFrequently: true });
  px.drawImage(im, 0, 0, W, H);
  PT_CROPS.probes++;
  const r = cropRect(px.getImageData(0, 0, W, H).data, W, H);
  const k = 1 / sc;                                    
  const s = Math.max(8, Math.min(Math.round(r.s * k), im.width, im.height));
  return {
    sx: Math.max(0, Math.min(im.width - s, Math.round(r.sx * k))),
    sy: Math.max(0, Math.min(im.height - s, Math.round(r.sy * k))),
    s, kind: r.kind,
  };
}

const MEAN_N = 64;
function meanLum(cv) {
  const n = Math.min(MEAN_N, cv.width, cv.height);
  const s = document.createElement('canvas'); s.width = s.height = n;
  const c = s.getContext('2d', { willReadFrequently: true });

  const px = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const col = new Float32Array(W), rowv = new Float32Array(H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) << 2;
      const l = 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
      col[x] += l; rowv[y] += l;

    for (; lag <= maxLag; lag++) if (corr[lag] > peakVal) { peakVal = corr[lag]; peakLag = lag; }

const cropCache = new Map();      
const cropWait = new Map();       
let texFailed = false;

function loadCropped(url, onReady) {
  const hit = cropCache.get(url);
  if (hit) { PT_CROPS.cacheHits++; stage('crop:cached'); onReady(hit.canvas, hit.lum); return; }
  const waiting = cropWait.get(url);
  if (waiting) { waiting.push(onReady); return; }
  cropWait.set(url, [onReady]);
  const fetchAt = performance.now();
  const done = (canvas, lum) => {
    const cbs = cropWait.get(url) ?? []; cropWait.delete(url);
    for (const cb of cbs) cb(canvas, lum);
  };
  let settled = false;
  const fail = (why, err) => {
    if (settled) return; settled = true;
    console.warn('[swatch]', why, url, err ?? '');
    texFailed = true;
    window.PT_STATE.degraded = true;
    try { parent.postMessage({ ptError: 'swatch', url, why }, '*'); } catch {   }
    done(null, 0.5);
  };
  const decodeBlob = async () => {
    const res = await fetch(url, { priority: 'high' });
    if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), { why: 'unreachable' });
    const blob = await res.blob();
    stage('fetch', performance.now() - fetchAt);
    const decAt = performance.now();
    try { return await createImageBitmap(blob); }
    finally { stage('decode', performance.now() - decAt); }
  };
  const decodeImg = () => new Promise((res, rej) => {
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => { stage('fetch', performance.now() - fetchAt); res(im); };
    im.onerror = () => rej(Object.assign(new Error('unreachable'), { why: 'unreachable' }));
    im.src = url;
  });
  (async () => {
    let src;
    try { src = typeof createImageBitmap === 'function' ? await decodeBlob() : await decodeImg(); }
    catch (e) { return fail(e?.why ?? 'undecodable', e?.message ?? e); }
    let c;
    try { c = timed('probe', () => cropFor(url, src)); } catch (e) { return fail('probe-threw', e?.message ?? e); }
    if (!c || !(c.s >= 8) || !Number.isFinite(c.sx + c.sy + c.s)) return fail('probe-degenerate');
    try {
      const size = Math.min(512, 1 << Math.floor(Math.log2(Math.max(8, c.s))));
      const cv = timed('tile', () => {
        const t = document.createElement('canvas'); t.width = t.height = size;
        t.getContext('2d', { willReadFrequently: true }).drawImage(src, c.sx, c.sy, c.s, c.s, 0, 0, size, size);
        return t;
      });
      src.close?.();
      const st = timed('analyse', () => tileStats(cv, url));
      const lum = st.lum;
      if (cropCache.size >= 48) cropCache.delete(cropCache.keys().next().value);
      cropCache.set(url, { canvas: cv, lum, periodPx: st.periodPx, periodCorr: st.periodCorr, side: size });
      log('[crop]', url, c.kind, c.s, '→', size, 'period', st.periodPx, '@', st.periodCorr);
      settled = true;
      done(cv, lum);
    } catch (e) { fail('crop-threw', e?.message ?? e); }
  })();
}

  m.map = null; m.bumpMap = null;             
  const old = origMats.get(o.name) ?? (Array.isArray(o.material) ? o.material[0] : o.material);
  if (old?.normalMap) {
    m.normalMap = old.normalMap;
    m.normalScale = new THREE.Vector2(0.55, 0.55);    
  }
  if (old?.aoMap) m.aoMap = old.aoMap;
  m.sheen = 0.28;                             
  m.userData = { clothUrl: srcMat.userData?.clothUrl ?? null, lum: srcMat.userData?.lum,
                 hex: srcMat.userData?.hex ?? null, hexBasis: srcMat.userData?.hexBasis ?? null,
                 pat: srcMat.userData?.pat ?? null, hexStrict: srcMat.userData?.hexStrict ?? false,
                 photoUnusable: srcMat.userData?.photoUnusable ?? false };
  installMix(m);                  
  if (srcMat.userData?.lum !== undefined) calmDark(m, srcMat.userData.lum);
  lateFabric.push({ m, kind, src: srcMat, root: currentRoot });
  const srcFlat = srcMat.map?.userData?.flat;
  if (srcFlat != null) paintFlat(m, kind, srcFlat); else retile(m, kind);
  const kinds = o.geometry?.userData?.maskGroups;
  o.material = kinds
    ? kinds.map((k) => (k === 'lining' ? makeLiningClone(currentSink) : k === 'horn' ? makeHornMat(currentRoot) : m))
    : m;
}

function dressInCloth(root, suitMat) {
  suitMat = suitMat ?? cloth;
  const report = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;                   
    if (!origMats.has(o.name) && !Array.isArray(o.material)) origMats.set(o.name, o.material);
    const name = `${o.name}/${o.material?.name ?? ''}`;
    if (BUTTONISH.test(name)) {
      o.material = new THREE.MeshPhysicalMaterial({ color: HORN[cur.buttons] ?? HORN['Dark horn'],
        roughness: 0.35, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.3 });
      buttonMeshes.push(o);
      report.push(`buttons: ${name}`);
      return;
    }
    const whole = wholeHornEntry(o);
    o.userData.hornWhole = !!whole;               
    if (whole) {
      o.material = makeHornMat(currentRoot);
      report.push(`buttons(mask, whole): ${name} ${whole.tris} tris`);
      return;
    }
    if (DEBUG_PAINT && /jacket/i.test(name)) {           
      const c = PAINT[paintIdx++ % PAINT.length];
      o.material = new THREE.MeshStandardMaterial({ color: c, side: THREE.DoubleSide });
      report.push(`PAINT ${paintIdx - 1} #${c.toString(16)}: ${name}`);
      return;
    }
    if (SHIRTISH.test(name)) { garb(o, 'shirt', shirtMat); report.push(`shirted: ${name}`); return; }
    if (SHOEISH.test(name)) {
      const orig = origMats.get(o.name) ?? o.material;
      shoeRegistry.push({ mesh: o, orig, root: currentRoot });
      o.material = shoeMaterial(cur.shoes, orig);
      report.push(`shoes(${cur.shoes}): ${name}`);
      return;
    }
    if (SKIP.test(name)) { report.push(`kept: ${name}`); return; }
    if (TROUSERISH.test(name)) { garb(o, 'trouser', suitMat); report.push(`trousered: ${name}`); return; }
    if (VESTISH.test(name)) { garb(o, 'vest', suitMat); report.push(`waistcoated: ${name}`); return; }
    garb(o, 'suit', suitMat);
    report.push(`clothed: ${name}`);
  });
  log('[suit pipeline]', report);
}

function assertButtons(root) {
  if (DEBUG_PAINT) return;
  let licensed = false;
  root.traverse((o) => { if (o.isMesh && /^Mens_Jacket_2/.test(o.name)) licensed = true; });
  if (!licensed) return;                                        
  if (!buttonMask) console.warn('[buttons] no button mask for this hero: only the placket page can be horn');
  const mine = buttonMeshes.filter((m) => {
    let p = m; while (p) { if (p === root) return true; p = p.parent; } return false;
  });
  if (mine.length !== 1) { console.error('[buttons] expected 1 mesh, got', mine.length); return; }
  const s = new THREE.Box3().setFromObject(mine[0]).getSize(new THREE.Vector3());
  const j = new THREE.Box3();
  root.traverse((o) => { if (o.isMesh && /jacket/i.test(o.name)) j.expandByObject(o); });
  if (j.isEmpty()) return;
  const jv = j.getSize(new THREE.Vector3());
  if ((s.x*s.y*s.z) > (jv.x*jv.y*jv.z) * 0.01) {
    console.error('[buttons] mesh is too large to be a placket — chunk numbering changed');
    for (const m of mine) {                                     
      const i = buttonMeshes.indexOf(m); if (i >= 0) buttonMeshes.splice(i, 1);
      const worn = m.material; garb(m, 'suit', suitMatOf(root)); worn?.dispose?.();
    }
  }
}

let interiorMask = null, buttonMask = null;
const MASK_FOR = { 'assets/suit/Mens_Suit_2.slim.glb': 'assets/suit/interior-mask.slim.json' };
const BUTTON_MASK_FOR = { 'assets/suit/Mens_Suit_2.slim.glb': 'assets/suit/button-mask.slim.json' };
function loadMaskFor(heroUrl) {
  const get = (f) => fetch(f).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  return Promise.all([
    get(MASK_FOR[heroUrl] ?? 'assets/suit/interior-mask.json').then((m) => (interiorMask = m)),
    get(BUTTON_MASK_FOR[heroUrl] ?? 'assets/suit/button-mask.json').then((m) => (buttonMask = m)),
  ]);
}

function wholeHornEntry(o) {
  const e = buttonMask?.[o.name];
  if (!e || e.horn !== e.tris) return null;
  if (e.hornDiag !== undefined && Math.abs(e.hornDiag - 1) > 1e-6) return null;    
  if ((o.geometry?.index?.count ?? 0) / 3 !== e.tris) return null;
  return hornPlausible(o, e) ? e : null;
}

function hornPlausible(o, entry, hornBox) {
  const g = o.geometry;
  if (!entry.shape) return true;                       
  if (!g.boundingBox) g.computeBoundingBox();
  const s = g.boundingBox.getSize(new THREE.Vector3());
  const d = s.length();
  if (!(d > 0)) return false;
  const got = [s.x / d, s.y / d, s.z / d];
  const off = Math.max(...got.map((v, i) => Math.abs(v - entry.shape[i])));
  if (off > 0.01) {
    console.error('[buttons] page shape does not match the mask on', o.name,
                  '— chunk numbering or the mesh changed. Leaving it in cloth.',
                  got.map((v) => v.toFixed(4)), 'vs', entry.shape);
    return false;
  }
  if (hornBox && entry.hornDiag !== undefined) {
    const ratio = hornBox.getSize(new THREE.Vector3()).length() / d;
    if (Math.abs(ratio - entry.hornDiag) > 0.02) {
      console.error('[buttons] masked triangles on', o.name, 'span', ratio.toFixed(4),
                    'of the page, expected', entry.hornDiag, '— that is not a button. Leaving it in cloth.');
      return false;
    }
  }
  return true;
}

const KIND = ['cloth', 'lining', 'horn'];
function splitByMask(o, entry, bEntry) {
  const g = o.geometry;
  if (!g.index || g.userData.maskSplit) return false;
  const idx = g.index.array;
  const triCount = idx.length / 3;
  const kind = new Uint8Array(triCount);               
  const mark = (e, v, tag) => {
    if (!e) return false;
    if (e.tris !== triCount) { console.warn(`[${tag}] mask/geometry mismatch on`, o.name, e.tris, triCount); return false; }
    for (let i = 0; i < e.rle.length; i += 2) for (let t = e.rle[i]; t < e.rle[i] + e.rle[i + 1]; t++) kind[t] = v;
    return true;
  };
  mark(entry, 1, 'lining');
  if (mark(bEntry, 2, 'buttons')) {
    const box = new THREE.Box3(), p = g.attributes.position, v = new THREE.Vector3();
    for (let t = 0; t < triCount; t++) if (kind[t] === 2) for (let k = 0; k < 3; k++) box.expandByPoint(v.fromBufferAttribute(p, idx[t * 3 + k]));
    if (!hornPlausible(o, bEntry, box)) for (let t = 0; t < triCount; t++) if (kind[t] === 2) kind[t] = 0;
  }
  const lists = [[], [], []];
  for (let t = 0; t < triCount; t++) lists[kind[t]].push(idx[t * 3], idx[t * 3 + 1], idx[t * 3 + 2]);
  if (!lists[1].length && !lists[2].length) return false;
  const newIdx = new idx.constructor(idx.length);
  const kinds = [];
  let at = 0;
  g.clearGroups();
  for (let k = 0; k < 3; k++) {
    if (!lists[k].length) continue;
    newIdx.set(lists[k], at);
    g.addGroup(at, lists[k].length, kinds.length);
    kinds.push(KIND[k]);
    at += lists[k].length;
  }
  g.setIndex(new THREE.BufferAttribute(newIdx, 1));
  g.userData.maskSplit = true;
  g.userData.maskGroups = kinds;
  const worn = Array.isArray(o.material) ? o.material[0] : o.material;
  o.material = kinds.map((k) => (k === 'lining' ? makeLiningClone(currentSink) : k === 'horn' ? makeHornMat(currentRoot) : worn));
  return true;
}

const heroRoots = [];
const suitInfo = new Map();       

function suitMatOf(root) { return suitInfo.get(root)?.mat ?? cloth; }

function fitToStage(root) {
  root.position.set(0, 0, 0);
  root.scale.setScalar(1);                           
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  root.scale.setScalar(118 / (size.y || 118));       
  const box2 = new THREE.Box3().setFromObject(root);
  root.position.y -= box2.min.y - (-31);             
  const c = box2.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z;
}

function placeSuit(g, suitMat, offsetX, isHero) {
  const root = g.scene;
  formSets.forEach((s) => (s.visible = false));
  const info = { mat: suitMat, homeX: 0, liningClones: [] };
  suitInfo.set(root, info);
  currentRoot = root; currentSink = info.liningClones;
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry?.index || !o.geometry.attributes?.position) return;
    if (o.geometry.userData.normalsRebuilt) return;               
    o.geometry.computeVertexNormals();
    o.geometry.userData.normalsRebuilt = true;
  });
  root.traverse((o) => { if (VESTISH.test(o.name)) o.visible = cur.vest; });
  {
    root.position.set(0, 0, 0); root.scale.setScalar(1);
    const pre = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
    measureDensity(root, 118 / (pre.y || 118));
  }
  dressInCloth(root, suitMat);
  root.traverse((o) => {
    if (!o.isMesh || BUTTONISH.test(`${o.name}/`) || o.userData.hornWhole) return;
    const lin = DEBUG_PAINT ? null : interiorMask?.[o.name];
    const btn = buttonMask?.[o.name];
    if (lin || btn) splitByMask(o, lin, btn);
  });
  assertButtons(root);
  fitToStage(root);
  info.homeX = root.position.x;
  root.position.x = info.homeX + offsetX;
  scene.add(root);
  heroRoots.push(root);
  currentRoot = null; currentSink = null;
  shadowRefresh();
  if (isHero) {
    window.PT_STATE.hero = true;
    try { parent.postMessage({ ptHero: 1 }, '*'); } catch {   }
  }
  frameSubject();
}

function setOffset(root, x) {
  const info = suitInfo.get(root);
  if (info) root.position.x = info.homeX + x;
  else root.position.x = x;
}

function disposeSuit(root) {
  const info = suitInfo.get(root);
  const clones = info?.liningClones ?? [];
  for (const c of clones) {
    const i = liningQueue.indexOf(c); if (i >= 0) liningQueue.splice(i, 1);
    stopTween(c); setMapB(c, null);
    setMap(c, 'map', null); c.dispose();
  }
  for (let i = lateFabric.length - 1; i >= 0; i--) if (lateFabric[i].root === root) lateFabric.splice(i, 1);
  for (let i = shoeRegistry.length - 1; i >= 0; i--) if (shoeRegistry[i].root === root) shoeRegistry.splice(i, 1);
  for (let i = buttonMeshes.length - 1; i >= 0; i--) {
    let p = buttonMeshes[i]; while (p && p !== root) p = p.parent;
    if (p === root) { buttonMeshes[i].material?.dispose?.(); buttonMeshes.splice(i, 1); }
  }
  for (let i = hornRegistry.length - 1; i >= 0; i--) {
    if (hornRegistry[i].root !== root) continue;
    hornRegistry[i].mat.dispose();
    hornRegistry.splice(i, 1);
  }
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m || clones.includes(m) || m === liningMat) continue;
      if (origMats.get(o.name) === m) continue;                   
      stopTween(m); setMapB(m, null);
      setMap(m, 'map', null); setMap(m, 'bumpMap', null);
      m.dispose();
    }
  });
  if (info) suitInfo.delete(root);
  const j = heroRoots.indexOf(root); if (j >= 0) heroRoots.splice(j, 1);
}

function setVest(on) {
  cur.vest = !!on;
  heroRoots.forEach((r) => r.traverse((o) => { if (VESTISH.test(o.name)) o.visible = cur.vest; }));
  shadowRefresh();
}

function subjectBox() {
  const subjects = heroRoots.length ? heroRoots : formSets.filter((s) => s.visible);
  if (!subjects.length) return null;
  const box = new THREE.Box3();
  subjects.forEach((s) => box.expandByObject(s));
  return box;
}
const subj = { center: new THREE.Vector3(0, 36, 0), top: 87, bottom: -31, homeDist: 231, ready: false };
function tagBand(viewportPx) {
  if (!heroTag && !compareTag) return 0;
  const h = Math.max(1, viewportPx ?? (renderer.domElement.clientHeight || paneH()));
  return Math.min(0.2, (Math.max(TAG_MIN_PX, h * 0.05) * 1.9) / h);
}
const tanFov = () => 2 * Math.tan((camera.fov * Math.PI) / 360);
const HOME_DIR = new THREE.Vector3(0.16, 0.06, 1).normalize();

let frameMargin = null;
const FRAME_AIR_PX = 16;
function setFrame(kind) {
  const want = kind === 'close' ? 1.06 : null;
  if (frameMargin === want) return;
  frameMargin = want;
  if (!viewLocked) frameSubject();
}
function frameSubject(margin) {
  margin = margin ?? frameMargin ?? (camera.aspect < 0.9 ? 1.3 : 1.2);    
  const paneHpx = Math.max(1, renderer.domElement.clientHeight || paneH() || 1);
  margin = Math.max(margin, (paneHpx + 2 * FRAME_AIR_PX) / paneHpx);
  const box = subjectBox();
  if (!box || !Number.isFinite(box.min.y) || !Number.isFinite(box.max.y)) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const band = tagBand();
  const tan = tanFov();
  const fitH = (size.y * margin) / ((1 - band) * tan);
  const fitW = (size.x * margin) / (tan * camera.aspect);
  const dist = Math.max(fitH, fitW, 70);
  if (!Number.isFinite(dist)) return;
  const dir = HOME_DIR.clone();
  const aim = center.clone();
  aim.y += (band * tan * dist) / 2;                  
  controls.target.copy(aim);
  camera.position.copy(aim).addScaledVector(dir, dist);
  controls.minDistance = Math.max(18, dist * 0.12, textureFloor());
  controls.maxDistance = dist * 2.2;
  controls.update();
  subj.center.copy(aim); subj.top = box.max.y; subj.bottom = box.min.y; subj.homeDist = dist;
  subj.ready = true;
  setZoomEnabled(true);
  setViewEnabled(true);         
  dirty();
}
function textureFloor() {
  const url = cur.cloth;
  const hit = url ? cropCache.get(url) : null;
  if (!hit || !(hit.side > 0)) return 0;
  const texelsPerUnit = (hit.side * CM_PER_UNIT) / Math.max(0.4, tileCmFor(url));
  const H = renderer.domElement.height || 1;
  const d = H / (tanFov() * Math.max(1e-6, texelsPerUnit));
  return Number.isFinite(d) && d > 0 ? d : 0;
}
function subjectWidth() {
  const r = heroRoots[0] ?? formSets[0];
  if (!r) return 47.4;
  return new THREE.Box3().setFromObject(r).getSize(new THREE.Vector3()).x || 47.4;
}
function dolly(factor) {
  const v = camera.position.clone().sub(controls.target);
  const d0 = v.length();
  if (!Number.isFinite(d0) || d0 < 1e-4) return;                   
  const len = THREE.MathUtils.clamp(d0 * factor, controls.minDistance, controls.maxDistance);
  const aim = controls.target.clone();
  if (subj.ready) {
    const span = Math.max(1, subj.homeDist - controls.minDistance);
    const t = Math.pow(THREE.MathUtils.clamp((subj.homeDist - len) / span, 0, 1), 0.6);
    const chestY = subj.bottom + (subj.top - subj.bottom) * 0.78;  
    aim.copy(subj.center);
    aim.y = THREE.MathUtils.lerp(subj.center.y, chestY, t);
  }
  const pos = aim.clone().addScaledVector(v.normalize(), len);
  if (!Number.isFinite(len) || !Number.isFinite(aim.x + aim.y + aim.z) ||
      !Number.isFinite(pos.x + pos.y + pos.z)) { console.error('[zoom] refused a non-finite step'); return; }
  userAdjusted = true;
  controls.target.copy(aim);
  camera.position.copy(pos);
  controls.update();
  dirty();
}
function setZoomEnabled(on) {
  for (const id of ['zin', 'zout', 'zreset']) {
    const b = document.getElementById(id);
    if (b) { b.disabled = !on; b.setAttribute('aria-disabled', String(!on)); }
  }
}
setZoomEnabled(false);
document.getElementById('zin')?.addEventListener('click', () => dolly(0.75));
document.getElementById('zout')?.addEventListener('click', () => dolly(1.34));
document.getElementById('zreset')?.addEventListener('click', () => {
  userAdjusted = false;
  viewLocked = false;
  closeInteriorCard();
  frameSubject();
  markCurrentView();
});

const TAU = Math.PI * 2;
const FRONT_AZ = Math.atan2(HOME_DIR.x, HOME_DIR.z);
const VIEWS = [
  { id: 'vfront', off: 0,          name: 'the front' },
  { id: 'vside',  off: Math.PI / 2, name: 'the side'  },
  { id: 'vback',  off: Math.PI,     name: 'the back'  },
];
const YAW_STEP = (15 * Math.PI) / 180;
const VIEW_NEAR = (3 * Math.PI) / 180;

const viewBtn = (id) => document.getElementById(id);
const azimuthNow = () => Math.atan2(camera.position.x - controls.target.x,
                                    camera.position.z - controls.target.z);
const wrapPi = (a) => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;    

function setAzimuth(theta) {
  const off = camera.position.clone().sub(controls.target);
  const s = new THREE.Spherical().setFromVector3(off);
  if (!Number.isFinite(s.radius) || s.radius < 1e-4) return;          
  s.theta = theta;                                                    
  const pos = controls.target.clone().add(new THREE.Vector3().setFromSpherical(s));
  if (!Number.isFinite(pos.x + pos.y + pos.z)) return;                
  userAdjusted = true;
  lastInputAt = performance.now();
  dismissHint();
  camera.position.copy(pos);
  controls.update();
  markCurrentView();
  dirty();
}
function yawBy(rad) { setAzimuth(azimuthNow() + rad); }

let shownView = '';
function markCurrentView() {
  const rel = wrapPi(azimuthNow() - FRONT_AZ);
  let at = '';
  for (const v of VIEWS) if (Math.abs(wrapPi(rel - v.off)) <= VIEW_NEAR) { at = v.id; break; }
  if (at === shownView) return;                                       
  shownView = at;
  for (const v of VIEWS) viewBtn(v.id)?.setAttribute('aria-checked', String(v.id === at));
  paintViewName();
}

const BAND_GONE = matchMedia('(max-height:220px)');
const bandVisible = () => {
  const b = document.getElementById('topband');
  return !!b && getComputedStyle(b).display !== 'none';
};
function canvasWhere() {
  const at = VIEWS.find((v) => v.id === shownView);
  return at ? `Seen from ${at.name}.` : 'Turned.';
}
function paintViewName() {
  const at = VIEWS.find((v) => v.id === shownView);
  const where = at ? `, seen from ${at.name}` : ', turned';
  const ops = 'Drag to turn it, or turn it with the left and right arrow keys. ' +
              'Press plus to come closer, minus to go back, zero for the whole suit.' +
              (bandVisible() ? ' The FRONT, SIDE and BACK buttons set the view.' : '');
  renderer.domElement.setAttribute('aria-label', `Your suit${where}. ${ops}`);
}
BAND_GONE.addEventListener?.('change', paintViewName);

function setViewEnabled(on) {
  for (const v of VIEWS) {
    const b = viewBtn(v.id);
    if (b) { b.disabled = !on; b.setAttribute('aria-disabled', String(!on)); }
  }
}
setViewEnabled(false);        

let roving = 0;
function focusView(i) {
  roving = (i + VIEWS.length) % VIEWS.length;
  for (let k = 0; k < VIEWS.length; k++) viewBtn(VIEWS[k].id)?.setAttribute('tabindex', k === roving ? '0' : '-1');
  const b = viewBtn(VIEWS[roving].id);
  b?.focus();
  return b;
}
VIEWS.forEach((v, i) => {
  const b = viewBtn(v.id);
  if (!b) return;
  b.addEventListener('click', () => {
    roving = i;
    for (let k = 0; k < VIEWS.length; k++) viewBtn(VIEWS[k].id)?.setAttribute('tabindex', k === i ? '0' : '-1');
    setAzimuth(FRONT_AZ + v.off);
  });
  b.addEventListener('keydown', (e) => {
    let n = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = roving + 1;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = roving - 1;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = VIEWS.length - 1;
    if (n === null) return;
    e.preventDefault();
    focusView(n)?.click();                        
  });
});

renderer.domElement.setAttribute('tabindex', '0');
function sayStage(words) {
  const el = document.getElementById('stagesay');
  if (!el || !words) return;
  el.textContent = '';                        
  setTimeout(() => { el.textContent = words; }, 30);
}
const dollyFactorNow = () => (subj.ready && subj.homeDist > 0
  ? subj.homeDist / Math.max(1e-4, camera.position.distanceTo(controls.target)) : 1);
function sayDolly() {
  const f = dollyFactorNow();
  sayStage(f <= 1.02 ? 'The framing — the whole suit.' : `Closer — ${f.toFixed(1)}× the framing.`);
}
function keyDolly(factor) {
  if (!subj.ready) return;
  const before = camera.position.distanceTo(controls.target);
  dolly(factor);
  const after = camera.position.distanceTo(controls.target);
  if (Math.abs(after - before) < 0.01) {
    sayStage(factor < 1 ? 'As close as this photograph goes.' : 'The whole suit is already in frame.');
    return;
  }
  sayDolly();
}
renderer.domElement.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;     
  if (e.key === 'ArrowRight') {
    e.preventDefault(); yawBy(-YAW_STEP);

const TAG_FONT = '600 60px Inter, -apple-system, Helvetica, sans-serif';
const TAG_H = 128, TAG_PAD = 36;
let tagProbe = null;
function tagWidth(text) {
  if (!tagProbe) tagProbe = document.createElement('canvas').getContext('2d');
  tagProbe.font = TAG_FONT;
  return Math.max(200, Math.ceil(tagProbe.measureText(String(text || '')).width) + TAG_PAD * 2);
}
function tagPlate(text) {
  const c = document.createElement('canvas');
  c.height = TAG_H;
  c.width = tagWidth(text);                         
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(17,17,17,0.85)'; x.fillRect(0, 0, c.width, TAG_H);
  x.fillStyle = '#fff'; x.font = TAG_FONT;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, c.width / 2, TAG_H / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  return t;
}
function codeTag(text) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagPlate(text), depthTest: false }));
  sp.userData.aspect = tagWidth(text) / TAG_H;
  sp.userData.said = String(text || '');
  sp.renderOrder = 5;
  return sp;
}
function retagPlate(sp, text) {
  const said = String(text || '');
  if (!sp || sp.userData.said === said) return;
  sp.material.map?.dispose();
  sp.material.map = tagPlate(said);
  sp.material.needsUpdate = true;
  sp.userData.aspect = tagWidth(said) / TAG_H;
  sp.userData.said = said;
}
const tagCodeOnly = (s) => {
  const t = String(s || ''), i = t.lastIndexOf(' · ');
  return i < 0 ? t : t.slice(i + 3);
};
const TAG_MIN_PX = 34;                      
const TAG_FLOOR_PX = 28;                    
const TAG_GUTTER_PX = 12;                   
const TAG_EDGE = 0.012;                     
function sizeTags(viewportPx, cam) {
  if (!heroTag && !compareTag) return;
  const c = cam ?? camera;
  if (!Number.isFinite(c.position.x + c.position.y + c.position.z)) return;
  const h = Math.max(1, viewportPx ?? (renderer.domElement.clientHeight || paneH()));
  const camAsp = Math.max(c.aspect, 0.01);
  const stageW = Math.max(1, h * camAsp);
  const tanH = 2 * Math.tan((c.fov * Math.PI) / 360);
  c.updateMatrixWorld();                               

  const tags = [heroTag, compareTag].filter(Boolean);
  const pair = tags.length === 2;
  const gutterN = (2 * TAG_GUTTER_PX) / stageW;
  const laneHalf = (2 - gutterN - 2 * TAG_EDGE) / 4;

  let wantPx = Math.max(TAG_MIN_PX, h * 0.05);
  let mode = 'full';
  if (pair) {
    const widest = (key) => Math.max(...tags.map((t) => t.userData[key] ?? t.userData.aspect ?? 4));
    const fits = (aspMax, px) => (px * aspMax) / stageW <= laneHalf;
    const shrunk = (aspMax) =>
      Math.max(TAG_FLOOR_PX, Math.min(wantPx, (laneHalf * stageW) / Math.max(aspMax, 0.01)));
    const fullMax = widest('fullAspect');
    if (fits(fullMax, wantPx)) {
    } else if (fits(fullMax, shrunk(fullMax))) {
      wantPx = shrunk(fullMax);                        
    } else {
      mode = 'code';                                   
      const codeMax = widest('codeAspect');
      wantPx = fits(codeMax, wantPx) ? wantPx : shrunk(codeMax);
    }
    for (const t of tags) {
      retagPlate(t, mode === 'code' ? (t.userData.code ?? t.userData.said)
                                    : (t.userData.full ?? t.userData.said));
    }
  }

  let leftTag = null;
  if (pair) {
    const at = (t) => {
      const v = new THREE.Vector3(t.userData.anchorX ?? 0, t.userData.topY ?? 0, 0).project(c);
      return Number.isFinite(v.x) ? v.x : 0;
    };
    const a = at(tags[0]), b = at(tags[1]);
    leftTag = a === b ? tags[0] : (a < b ? tags[0] : tags[1]);
  }

  for (const sp of tags) {
    const asp = sp.userData.aspect ?? 4;
    sp.position.set(sp.userData.anchorX ?? sp.position.x, sp.userData.topY ?? sp.position.y, 0);
    const worldPerPx = (tanH * c.position.distanceTo(sp.position)) / h;
    const hh = Math.max(2, wantPx * worldPerPx);
    if (!Number.isFinite(hh)) continue;
    sp.scale.set(hh * asp, hh, 1);
    sp.position.y = (sp.userData.topY ?? sp.position.y) + hh * 0.75;
    const halfH = wantPx / h, halfW = (wantPx * asp) / stageW;
    const top = 1 - halfH - TAG_EDGE;
    const p = sp.position.clone().project(c);
    if (!Number.isFinite(p.x + p.y + p.z)) continue;
    if (p.y > top) { sp.position.y = (sp.userData.topY ?? sp.position.y) - hh * 0.85; p.copy(sp.position).project(c); }
    let lo = -1 + TAG_EDGE + halfW, hi = 1 - TAG_EDGE - halfW;
    if (pair) {
      if (sp === leftTag) hi = Math.min(hi, -gutterN / 2 - halfW);
      else lo = Math.max(lo, gutterN / 2 + halfW);
      if (lo > hi) { const m = sp === leftTag ? -gutterN / 2 - halfW : gutterN / 2 + halfW; lo = hi = m; }
    }
    const nx = THREE.MathUtils.clamp(p.x, lo, hi);
    const ny = THREE.MathUtils.clamp(p.y, -1 + halfH + TAG_EDGE, top);
    if (nx !== p.x || ny !== p.y) {
      const back = new THREE.Vector3(nx, ny, p.z).unproject(c);
      if (Number.isFinite(back.x + back.y + back.z)) sp.position.copy(back);
    }
  }
}

function placeTags() {
  dropTag(heroTag); dropTag(compareTag); heroTag = compareTag = null;

  const pairs = [[heroRoots[0] ?? mainSet, cur.code, 'hero'], [secondSuit ?? compareForm, cur.comparecode, 'cmp']];

function setCompare(url, code2) {

function paintSuitInto(x, dx, dy, CW, CH) {
  const box = subjectBox();

    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const tan = 2 * Math.tan((cardCam.fov * Math.PI) / 360);
    const dist = Math.max((size.y * 1.02) / tan, (size.x * 1.12) / tan / cardCam.aspect, 40);
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-6) dir.set(0.16, 0.06, 1);
    cardCam.position.copy(center).addScaledVector(dir.normalize(), dist);

    cardCam.position.copy(camera.position); cardCam.quaternion.copy(camera.quaternion);
  }
  cardCam.updateProjectionMatrix();
  renderer.setPixelRatio(1);
  renderer.setSize(CW, CH, false);

  const liveGround = scene.background.getHex();

      ? cardCanvas.toBlob((b) => (b ? res(b) : rej(new Error('no blob'))), 'image/png')
      : rej(new Error('no card')));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    cardCopy.textContent = 'Copied ✓';
  } catch { cardCopy.textContent = 'Long-press the image'; }
  setTimeout(resetCardButtons, 2000);
});
cardShare.addEventListener('click', async () => {
  try {
    const blob = await (await fetch(document.querySelector('#card img').src)).blob();
    const file = new File([blob], 'bespoke-by-paul-look.jpg', { type: 'image/jpeg' });
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: 'My Bespoke by Paul suit' });
    else {
      await navigator.clipboard.writeText(document.referrer || location.href);
      cardShare.textContent = 'Link copied ✓';
      setTimeout(resetCardButtons, 2000);
    }
  } catch {   }
});

const gltf = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const HERO_URLS = [
  ...(DEBUG && q.get('hero') ? [q.get('hero')] : []),
  'assets/suit/Mens_Suit_2.slim.glb',       
  'assets/suit/Mens_Suit_2.slim.gltf',      
  'assets/suit/Mens_Suit_2.gltf',           
  ...(q.get('rig') === '1' ? ['assets/test-suit/quaternius-suit.glb'] : []),
];

function exportThumb() {
  const t0 = performance.now();
  (function poll() {
    if (window.PT_OK() || texFailed || performance.now() - t0 > 5000) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        renderer.render(scene, camera);
        try { parent.postMessage({ ptThumb: cur.code, data: renderer.domElement.toDataURL('image/jpeg', 0.85) }, '*'); }
        catch (e) { console.error('[thumb]', e); }
      }));
    } else setTimeout(poll, 120);
  })();
}

function onProgress(e) {
  const bar = document.querySelector('#loadline .bar i');
  if (!bar || !e?.lengthComputable || !e.total) return;
  document.getElementById('loadline')?.classList.add('det');
  bar.style.width = Math.max(4, Math.round((e.loaded / e.total) * 100)) + '%';
}

async function loadHero(list) {
  for (const url of list) {
    let g = null;
    try { g = await new Promise((res, rej) => gltf.load(url, res, onProgress, rej)); }
    catch (err) { log('[hero] not available', url, err?.message ?? err); continue; }
    await loadMaskFor(url);
    heroGLTF = g;
    placeSuit(g, cloth, 0, true);
    log('[hero]', url);
    if (cur.compare && !THUMB) setCompare(cur.compare, cur.comparecode);
    if (THUMB) { frameSubject(1.04); exportThumb(); }
    (function readyPoll() {
      if (window.PT_OK() || texFailed || !imgParamPresent) { window.PT_READY = true; reveal(); }
      else setTimeout(readyPoll, 150);
    })();
    return;
  }
  console.warn('[hero] no suit model loaded — showing the dress form');
  window.PT_READY = true;
  window.PT_STATE.degraded = true;
  capNote = 'The tailored form is loading slowly — the cloth shown is correct.';
  if (cur.compare) setCompare(cur.compare, cur.comparecode);
  frameSubject();
  paintCaption();
  reveal();
}

function reveal() {
  document.body.classList.add('ready');
  armHint();                      
  paintViewName();                
  shadowRefresh();
  window.PT3D_READY?.();
}

addEventListener('message', (ev) => {
  if (ev.source !== parent) return;                   
  const d = ev.data;
  if (!d || d.ptSet !== 1) return;
  if ('cloth' in d || 'compare' in d) {
    SWAP_LOG.length = 0;
    try { performance.clearMarks(); performance.clearMeasures(); } catch {   }
    swapT0 = performance.now();
    stage('message');
  }

  let caption = false;
  if ('photoUnusable' in d) {
    cloth.userData.photoUnusable = cur.photounusable = !!d.photoUnusable;
    if (isCoveredSilk(cur.buttons)) repaintButtons();
  }
  if ('shirtphotoUnusable' in d) shirtMat.userData.photoUnusable = cur.shirtphotounusable = !!d.shirtphotoUnusable;
  if ('comparephotoUnusable' in d) cur.comparephotounusable = !!d.comparephotoUnusable;
  if ('hexBasis' in d) cloth.userData.hexBasis = cur.hexbasis = d.hexBasis ?? null;
  if ('pat' in d) cloth.userData.pat = cur.pat = d.pat ?? null;
  if ('comparehexbasis' in d) cur.comparehexbasis = d.comparehexbasis ?? null;
  if ('comparepat' in d) cur.comparepat = d.comparepat ?? null;
  if ('hex' in d) {
    cloth.userData.hex = cur.hex = d.hex ?? null;
    if (!window.PT_OK() && cloth.userData.clothUrl) {
      const known = hexTrust(cloth.userData);
      const fb = known ?? NO_COLOUR;
      cloth.color?.setHex(fb);
      for (const e of lateFabric) if (e.src === cloth) e.m.color?.setHex(fb);
      setSwatchMissing(known !== null ? 'measured' : 'unmeasured');
    }
    if (isCoveredSilk(cur.buttons)) repaintButtons();
  }
  if ('shirthex' in d) shirtMat.userData.hex = cur.shirthex = d.shirthex ?? null;
  if ('bandTop' in d || 'bandBottom' in d) {
    const n = (v, f) => Math.max(0, Math.min(240, Number(v ?? f) || 0));
    cur.bandTop = n(d.bandTop, cur.bandTop); cur.bandBottom = n(d.bandBottom, cur.bandBottom);
    applyReserve(); sizeToPane();
  }
  if ('lininghex' in d) liningMat.userData.hex = cur.lininghex = d.lininghex ?? null;
  if ('comparehex' in d) {
    cur.comparehex = d.comparehex ?? null;
    const cm = secondSuit ? suitMatOf(secondSuit) : (compareForm ? suitInfo.get(compareForm)?.mat : null);
    if (cm) { cm.userData.hex = cur.comparehex; cm.userData.hexBasis = cur.comparehexbasis; cm.userData.pat = cur.comparepat; }
  }
  if ('pat' in d || 'repeatCm' in d || 'repeat' in d || 'shirtpat' in d || 'liningpat' in d ||
      'comparepat' in d || 'comparerepeatCm' in d || 'cloth' in d || 'compare' in d ||
      'shirt' in d || 'lining' in d) {
    if ('repeatCm' in d || 'repeat' in d) cur.repeatcm = Number(d.repeatCm ?? d.repeat) || null;
    if ('comparerepeatCm' in d) cur.comparerepeatcm = Number(d.comparerepeatCm) || null;
    if ('shirtpat' in d) cur.shirtpat = d.shirtpat ?? null;
    if ('liningpat' in d) cur.liningpat = d.liningpat ?? null;
    for (const [k, url] of [['cloth', d.cloth], ['compare', d.compare], ['shirt', d.shirt], ['lining', d.lining]]) {
      if (!(k in d) || !url) continue;
      const pat = k === 'cloth' ? (('pat' in d) ? d.pat : cur.pat)
                : k === 'compare' ? (('comparepat' in d) ? d.comparepat : cur.comparepat)
                : k === 'shirt' ? cur.shirtpat : cur.liningpat;
      const cm = k === 'cloth' ? cur.repeatcm : k === 'compare' ? cur.comparerepeatcm : null;
      noteCloth(url, pat, cm);
    }
    noteAll();
  }
  if ('cloth' in d) {
    const v = d.cloth ?? null;
    if (v !== cur.cloth) {
      cur.cloth = v; caption = true;
      timed('applyFabric', () => (v ? applyFabric(cloth, v, 'form') : clearFabric(cloth)));
    }
  }
  if ('shirt' in d) {
    const v = d.shirt ?? null;
    if (v !== cur.shirt) { cur.shirt = v; v ? applyFabric(shirtMat, v, 'shirt') : clearFabric(shirtMat, 0xf4f1ea); }
  }
  if ('liningCode' in d) { const v = d.liningCode ?? null; if (v !== cur.liningCode) { cur.liningCode = v; paintLiningChip(); } }
  if ('lining' in d) { const v = d.lining ?? null; if (v !== cur.lining) setLining(v); }
  if ('shoes'   in d && d.shoes   !== cur.shoes)   setShoes(d.shoes);
  if ('buttons' in d && d.buttons !== cur.buttons) setButtons(d.buttons);
  if ('scene'   in d && d.scene   !== cur.scene && (d.scene === 'studio' || d.scene === 'evening')) applyScene(d.scene);
  if ('ground'    in d) setGround(d.ground);
  if ('frame'     in d) setFrame(d.frame);
  if ('wheelzoom' in d) setWheelZoom(d.wheelzoom);
  if ('vest'    in d && !!d.vest  !== cur.vest)    setVest(d.vest);
  let retag = false;
  if ('code' in d)   { if (d.code   !== cur.code)   { cur.code = d.code ?? '';     caption = true; retag = true; } }
  if ('plain' in d)  { if (d.plain  !== cur.plain)  { cur.plain = d.plain ?? '';   caption = true; } }
  if ('book' in d)   { if (d.book   !== cur.book)   { cur.book = d.book ?? '';     caption = true; } }
  if ('weight' in d) { if (d.weight !== cur.weight) { cur.weight = d.weight ?? ''; caption = true; } }
  if ('comparecode' in d) { const v = d.comparecode ?? null; if (v !== cur.comparecode) { cur.comparecode = v; retag = true; caption = true; } }
  if ('compare' in d) {
    const v = d.compare ?? null;
    if (v !== cur.compare) { setCompare(v, cur.comparecode); caption = false; retag = false; }
  }
  if (retag) timed('tags', () => placeTags());     
  if ('price' in d) cur.price = d.price ?? '';        
  if (caption) timed('caption', () => paintCaption());
  if ('view' in d) setView(d.view);
  if (d.snap) openCard();
  stage('handled');
  dirty();
});

let lastW = -1, lastH = -1;                
function sizeToPane() {
  const w = paneW(), h = paneH();
  if (w === lastW && h === lastH) return;
  lastW = w; lastH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (!subj.ready) frameSubject();
  else if (wheelZoom && !userAdjusted && !viewLocked) frameSubject();
  dirty();
}
addEventListener('resize', () => { sizeToPane(); dirty(); });
new ResizeObserver(() => { sizeToPane(); dirty(); }).observe(stageEl);

const lastPose = { pos: new THREE.Vector3(), tgt: new THREE.Vector3(), ok: false };
const poseFinite = () => Number.isFinite(camera.position.x + camera.position.y + camera.position.z) &&
                         Number.isFinite(controls.target.x + controls.target.y + controls.target.z) &&
                         Number.isFinite(camera.aspect) && camera.aspect > 0;
function drawFrame() {
  const nowMs = performance.now();
  stepTweens(nowMs);                
  sizeToPane();
  const moved = controls.update();             
  if (poseFinite()) { lastPose.pos.copy(camera.position); lastPose.tgt.copy(controls.target); lastPose.ok = true; }
  else {
    console.error('[view] non-finite camera — restoring the last good framing');
    camera.aspect = paneW() / paneH();
    camera.updateProjectionMatrix();
    if (lastPose.ok) { camera.position.copy(lastPose.pos); controls.target.copy(lastPose.tgt); }
    else { camera.position.set(34, 52, 225); controls.target.set(0, 36, 0); }
    controls.update();
    if (!poseFinite()) frameSubject();
  }
  sizeTags();
  placeEdge();                      
  const renderAt = performance.now();
  renderer.render(scene, camera);
  RENDER.draws += renderer.info.render.calls;
  RENDER.lastRenderAt = performance.now();
  if (swapT0 && RENDER.lastRenderAt - swapT0 < 3000) {
    stage('render', RENDER.lastRenderAt - renderAt);
    stage('frame', RENDER.lastRenderAt - nowMs);
  }
  return moved;
}

const COAST_MS = 700;                     
const SETTLED = 1e-2;                     
let lastInputAt = -Infinity;
const seen = { pos: new THREE.Vector3(), tgt: new THREE.Vector3(), has: false };
function stillMoving() {
  const dp = seen.has ? seen.pos.distanceTo(camera.position) : Infinity;
  const dt = seen.has ? seen.tgt.distanceTo(controls.target) : Infinity;
  seen.pos.copy(camera.position); seen.tgt.copy(controls.target); seen.has = true;
  if (!Number.isFinite(dp) || !Number.isFinite(dt)) return true;
  if (dp <= SETTLED && dt <= SETTLED) return false;
  return performance.now() - lastInputAt < COAST_MS;
}
let inFrame = false;
function onFrame() {
  rafId = 0;
  if (RENDER.parked) return;
  inFrame = true;
  let more = false;
  try {
    const moved = drawFrame();
    more = moved && stillMoving();
    if (moved && !more) {
      let n = 0; while (controls.update() && ++n < 240);
      drawFrame();
    }
  } finally { inFrame = false; }
  if (!more) stillMoving();                         
  if (more || tweenActive()) dirty();
}
controls.addEventListener('change', () => { markCurrentView(); if (!inFrame) dirty(); });

function repark() {
  const next = document.hidden || !RENDER.onScreen;
  if (next === RENDER.parked) return;
  RENDER.parked = next;
  if (next) { cancelAnimationFrame(rafId); rafId = 0; }
  else dirty();                                   
}
if (!THUMB) {
  new IntersectionObserver(([e]) => { RENDER.onScreen = e.isIntersecting; repark(); }, { threshold: 0 })
    .observe(renderer.domElement);
  document.addEventListener('visibilitychange', repark);
}
dirty();                                          

window.PT_RENDER = () => { drawFrame(); };
window.PT_OK = () => !!cloth.map && cloth.map !== BLANK && !cloth.map.userData?.flat;
window.PT_ZOOM = () => {
  const d = camera.position.distanceTo(controls.target);
  const tf = textureFloor();
  const hit = cur.cloth ? cropCache.get(cur.cloth) : null;
  const texels = hit && hit.side ? (hit.side * CM_PER_UNIT) / Math.max(0.4, tileCmFor(cur.cloth)) : 0;
  const H = renderer.domElement.height || 1;
  return {
    floor: +controls.minDistance.toFixed(2),
    ceiling: +controls.maxDistance.toFixed(2),
    texture: +tf.toFixed(2),
    here: +d.toFixed(2),
    texelsPerUnit: +texels.toFixed(2),
    px: texels ? +((controls.minDistance * tanFov() * texels) / H).toFixed(3) : null,
    pan: controls.enablePan,
    twoFinger: controls.touches.TWO === THREE.TOUCH.DOLLY_ROTATE ? 'DOLLY_ROTATE' : 'other',
    wheelZoom,
  };
};
window.PT_STATS = () => ({
  fit: (() => {
    if (!subj.ready) return null;
    const h = renderer.domElement.clientHeight || paneH() || 1;
    const at = (y) => { const v = new THREE.Vector3(0, y, 0).project(camera);
                        return +(((-v.y * 0.5) + 0.5) * h).toFixed(1); };
    const top = at(subj.top), bottom = at(subj.bottom);
    return { paneH: h, top, bottom, airTop: +top.toFixed(1),
             airBottom: +(h - bottom).toFixed(1) };
  })(),
  frame: renderer.info.render.frame,
  frames: renderer.info.render.frame,
  draws: RENDER.draws,
  textures: renderer.info.memory.textures,
  lastRenderAt: RENDER.lastRenderAt,
  parked: RENDER.parked,
  pending: !!rafId,
  geometries: renderer.info.memory.geometries,
  programs: renderer.info.programs?.length ?? 0,
  pool: texPool.size,
  crops: { ...PT_CROPS },
  scale: (() => {
    const url = cur.cloth; if (!url) return null;
    const c = cropCache.get(url);
    const out = { tileCm: +tileCmFor(url).toFixed(2), periodPx: c?.periodPx ?? null, periodCorr: c?.periodCorr ?? 0,
                  pat: PATTERN_OF.get(url) ?? null, repeatCm: REPEAT_CM.get(url) ?? null, repeat: {}, cmPerTile: {} };
    for (const k of ['suit', 'trouser', 'vest', 'shirt']) {
      const r = repeatFor(k, url);
      out.repeat[k] = +r.toFixed(2);
      out.cmPerTile[k] = +(CM_PER_UNIT / (r * (GARMENT_DENSITY[k] ?? GARMENT_DENSITY.suit))).toFixed(2);
    }
    return out;
  })(),
  density: { ...GARMENT_DENSITY },
  pose: { pos: camera.position.toArray().map((v) => +v.toFixed(3)),
          target: controls.target.toArray().map((v) => +v.toFixed(3)),
          aspect: +camera.aspect.toFixed(4) },
  tweens: tweens.size,
  mix: (() => { let m = 0; for (const tw of tweens) for (const mat of tw.mats.keys()) m = Math.max(m, mat.userData.mix.factor.value); return m; })(),
});

function jacketNDCBox() {
  const box = new THREE.Box3();
  const root = heroRoots[0];
  if (root) root.traverse((o) => {
    if (o.isMesh && o.visible && /jacket/i.test(o.name) && !BUTTONISH.test(`${o.name}/`)) box.expandByObject(o);
  });
  if (box.isEmpty()) { const s = formSets.find((f) => f.visible); if (s) box.expandByObject(s); }
  if (box.isEmpty() || !Number.isFinite(box.min.y + box.max.y)) return null;
  camera.updateMatrixWorld();
  const v = new THREE.Vector3();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < 8; i++) {
    v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).project(camera);
    if (!Number.isFinite(v.x + v.y)) return null;
    x0 = Math.min(x0, v.x); y0 = Math.min(y0, v.y); x1 = Math.max(x1, v.x); y1 = Math.max(y1, v.y);
  }
  return { x0, y0, x1, y1 };
}
if (DEBUG) window.PT_YAW = (deg) => {
  const r = (deg * Math.PI) / 180, d = 260;
  controls.target.set(0, 28, 0);
  camera.position.set(Math.sin(r) * d, 28 + 10, Math.cos(r) * d);
  viewLocked = true;                        
  controls.update();
  drawFrame();
  return { yaw: deg, pos: camera.position.toArray().map((v) => +v.toFixed(2)) };
};
window.PT_SAMPLE = () => {
  window.PT_RENDER();
  const nb = jacketNDCBox();
  if (!nb) return null;
  const gl = renderer.getContext();
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const W = Math.max(1, Math.round(size.x)), H = Math.max(1, Math.round(size.y));
  const cx = (nb.x0 + nb.x1) / 2, wN = nb.x1 - nb.x0, hN = nb.y1 - nb.y0;
  const px = (n, D) => Math.round(((n + 1) / 2) * D);
  const rx0 = Math.max(0, Math.min(W - 2, px(cx - wN * 0.17, W)));
  const rx1 = Math.max(rx0 + 1, Math.min(W - 1, px(cx + wN * 0.17, W)));
  const ry0 = Math.max(0, Math.min(H - 2, px(nb.y1 - hN * 0.60, H)));
  const ry1 = Math.max(ry0 + 1, Math.min(H - 1, px(nb.y1 - hN * 0.30, H)));
  const bw = rx1 - rx0, bh = ry1 - ry0;
  const buf = new Uint8Array(bw * bh * 4);
  gl.readPixels(rx0, ry0, bw, bh, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const bg = new Uint8Array(4);
  gl.readPixels(1, H - 2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, bg);
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < buf.length; i += 4) {
    if (buf[i + 3] < 8) continue;
    if (Math.abs(buf[i] - bg[0]) + Math.abs(buf[i + 1] - bg[1]) + Math.abs(buf[i + 2] - bg[2]) < 12) continue;
    r += buf[i]; g += buf[i + 1]; b += buf[i + 2]; n++;
  }
  if (!n) return null;
  const out = [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  return { r: out[0], g: out[1], b: out[2], n, total: bw * bh,
           hex: '#' + out.map((c) => c.toString(16).padStart(2, '0')).join(''),
           rect: [rx0, ry0, bw, bh] };
};

setTimeout(() => {
  if (window.PT_READY) return;
  window.PT_READY = true;
  window.PT_STATE.degraded = true;
  if (!heroRoots.length) frameSubject();
  capNote = 'Still drawing the cloth — the colour and code above are correct.';
  paintCaption();
  reveal();
}, 25000);

applyScene(cur.scene);
setButtons(cur.buttons);
setShoes(cur.shoes);
paintLining();
paintCaption();
paintLiningChip();
loadHero(HERO_URLS);

addEventListener('wheel', (e) => {
  if (wheelZoom) return;
  if (document.activeElement === renderer.domElement) return;    
  e.stopPropagation();                                           
}, { capture: true, passive: true });


</script>
